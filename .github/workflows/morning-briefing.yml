
name: Morning briefing operations

on:
  schedule:
    # GitHub Actions cron uses UTC. These are 00:00, 06:00 and 06:15 Asia/Seoul.
    # The 06:00 run guarantees finalization after scale-to-zero. The 06:15
    # watchdog leaves a 75-minute scheduling buffer, keeps the service warm,
    # and releases the final dispatch at 07:30.
    # UTC Sunday–Thursday corresponds to KST Monday–Friday mornings.
    - cron: "0 15 * * 0-4"
    - cron: "0 21 * * 0-4"
    - cron: "15 21 * * 0-4"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: run
        type: choice
        options:
          - generate
          - dispatch
          - run
          - regenerate-all
          - test-push
          - welcome-preview-status
          - welcome-preview
          - status
      preview_new_subscriptions:
        description: Expected number of newly registered devices for welcome-preview
        required: false
        default: 4
        type: number
      send_telegram_report:
        description: Send the private operator report after this manual run
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: morning-briefing-production
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.calendar.outputs.allowed }}
    steps:
      - id: calendar
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$(TZ=Asia/Seoul date +%u)" -le 5 ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
  operate:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Choose operation
        id: operation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            operation="$REQUESTED_OPERATION"
            if [[ "$REQUESTED_OPERATION" == "run" ]]; then
              final_delivery=true
            else
              final_delivery=false
            fi
          elif [[ "$SCHEDULE" == "0 15 * * 0-4" || "$SCHEDULE" == "0 21 * * 0-4" ]]; then
            operation="generate"
            final_delivery=false
          elif [[ "$SCHEDULE" == "15 21 * * 0-4" ]]; then
            operation="run"
            final_delivery=true
          else
            echo "Unexpected schedule: ${SCHEDULE}" >&2
            exit 1
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "final_delivery=$final_delivery" >> "$GITHUB_OUTPUT"

      - name: Keep service warm until 07:30 KST
        if: github.event_name == 'schedule' && steps.operation.outputs.final_delivery == 'true'
        shell: bash
        run: |
          target="$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 07:30:00" +%s)"
          while true; do
            now="$(date +%s)"
            remaining=$((target - now))
            if (( remaining <= 0 )); then break; fi
            curl --silent --show-error --max-time 30 \
              --retry 3 --retry-all-errors \
              "https://morningnews.coders.kr/api/push/public-key" >/dev/null || true
            if (( remaining > 60 )); then sleep 60; else sleep "$remaining"; fi
          done

      - name: Wake backend API
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            config="$(curl --fail-with-body --silent --show-error \
              --max-time 45 \
              "https://morningnews.coders.kr/api/push/public-key" 2>/dev/null || true)"
            if jq -e '.enabled == true' <<< "$config" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend API did not become ready within the 10-minute wake-up window" >&2
          exit 1

      - name: Wake service and run morning operation
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          EXPECTED_NEW_SUBSCRIPTIONS: ${{ inputs.preview_new_subscriptions }}
        run: |
          test -n "$ADMIN_TOKEN"
          if [[ "$OPERATION" == "status" ]]; then
            status="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              "https://morningnews.coders.kr/api/admin/briefings/subscriptions" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN")"
            active="$(jq -r '.activeSubscriptions' <<< "$status")"
            changed_at="$(jq -r '.lastChangedAt // "기록 없음"' <<< "$status")"
            reason="$(jq -r '.lastChangeReason // "기록 없음"' <<< "$status")"
            {
              echo "### 활성 알림 기기 현황"
              echo ""
              echo "- 활성 기기: **${active}대**"
              echo "- 마지막 수 변경: ${changed_at}"
              echo "- 변경 사유: ${reason}"
              echo ""
              echo "| 기기 종류 | 브라우저 | 활성 수 |"
              echo "|---|---|---:|"
              jq -r '.deviceBreakdown[] | "| \(.deviceType) | \(.browser) | \(.count)대 |"' <<< "$status"
              echo ""
              echo "> 사용자 화면에는 표시되지 않는 운영자용 집계입니다."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$OPERATION" == "test-push" ]]; then
            active="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              "https://morningnews.coders.kr/api/admin/briefings/subscriptions" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" | jq -r '.activeSubscriptions')"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/test-push" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"expectedActiveSubscriptions\":${active}}"
          elif [[ "$OPERATION" == "welcome-preview-status" ]]; then
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              "https://morningnews.coders.kr/api/admin/briefings/welcome-preview" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN"
          elif [[ "$OPERATION" == "welcome-preview" ]]; then
            expected_new="${EXPECTED_NEW_SUBSCRIPTIONS:-4}"
            expected_total=$((expected_new + 1))
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/welcome-preview" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"expectedNewSubscriptions\":${expected_new},\"expectedTotalSubscriptions\":${expected_total}}"
          elif [[ "$OPERATION" == "regenerate-all" ]]; then
            briefing_date="$(TZ=Asia/Seoul date +%F)"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 90 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/regenerate" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"expectedBriefingDate\":\"${briefing_date}\"}"
          elif [[ "$OPERATION" == "generate" ]]; then
            accepted=false
            for attempt in $(seq 1 12); do
              if curl --fail-with-body --silent --show-error \
                --retry 1 --retry-all-errors --max-time 45 \
                -X POST "https://morningnews.coders.kr/api/admin/briefings/generate" \
                -H "X-Briefing-Admin-Token: $ADMIN_TOKEN"; then
                accepted=true
                break
              fi
              status="$(curl --fail-with-body --silent --show-error \
                --max-time 30 \
                "https://morningnews.coders.kr/api/admin/briefings/status" \
                -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" 2>/dev/null || true)"
              state="$(jq -r '.generationJob.state // empty' <<< "$status" 2>/dev/null || true)"
              ready="$(jq -r '.productionReady // false' <<< "$status" 2>/dev/null || true)"
              if [[ "$ready" == "true" || "$state" == "RUNNING" || "$state" == "COMPLETED" ]]; then
                accepted=true
                break
              fi
              echo "Briefing generation request temporarily unavailable (attempt ${attempt}/12); retrying" >&2
              sleep 10
            done
            if [[ "$accepted" != "true" ]]; then
              echo "Briefing generation request could not be confirmed" >&2
              exit 1
            fi
          else
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --max-time 720 \
              -X POST "https://morningnews.coders.kr/api/admin/briefings/$OPERATION" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN"
          fi

      - name: Wait for AI briefing generation
        if: steps.operation.outputs.operation == 'generate' || steps.operation.outputs.operation == 'run' || steps.operation.outputs.operation == 'regenerate-all'
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          # The 00:00 generation has ample lead time before the 07:30 dispatch.
          # Candidate count, concurrency and per-request timeouts keep this wait bounded.
          for attempt in $(seq 1 120); do
            status="$(curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --max-time 30 \
              "https://morningnews.coders.kr/api/admin/briefings/status" \
              -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" 2>/dev/null || true)"
            if ! jq -e '.generationJob.state' <<< "$status" >/dev/null 2>&1; then
              echo "Briefing status temporarily unavailable (attempt ${attempt}/120); retrying" >&2
              sleep 10
              continue
            fi
            ready="$(jq -r '.productionReady' <<< "$status")"
            state="$(jq -r '.generationJob.state' <<< "$status")"
            if [[ "$OPERATION" == "regenerate-all" ]]; then
              if [[ "$state" == "FAILED" ]]; then
                jq -r '.generationJob.error' <<< "$status" >&2
                exit 1
              fi
              result_date="$(jq -r '.generationJob.result.briefingDate // empty' <<< "$status")"
              stories="$(jq -r '.stories // 0' <<< "$status")"
              today="$(TZ=Asia/Seoul date +%F)"
              if [[ "$state" == "COMPLETED" && "$result_date" == "$today" ]]; then
                if [[ "$ready" == "true" && "$stories" -gt 0 ]]; then exit 0; fi
                echo "Regenerated briefing has no deliverable stories (stories=${stories})" >&2
                echo "Regenerated briefing is not publishable" >&2
                exit 1
              fi
              sleep 10
              continue
            fi
            stories="$(jq -r '.stories // 0' <<< "$status")"
            if [[ "$ready" == "true" && "$stories" -gt 0 ]]; then
              coverage_ready="$(jq -r '.coverageReady' <<< "$status")"
              if [[ "$coverage_ready" != "true" ]]; then
                stories="$(jq -r '.stories' <<< "$status")"
                categories="$(jq -r '.categories' <<< "$status")"
                reasons="$(jq -r '.blockReasons | join(", ")' <<< "$status")"
                {
                  echo "### 분량·분야 목표 경고"
                  echo ""
                  echo "- 생성 뉴스: ${stories}건"
                  echo "- 포함 분야: ${categories}개"
                  echo "- 경고: ${reasons}"
                  echo ""
                  echo "> 전날 확인 뉴스가 있으면 스포츠·e스포츠 유무와 관계없이 오전 7시 30분 발송합니다."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            if [[ "$state" == "FAILED" ]]; then
              jq -r '.generationJob.error' <<< "$status" >&2
              exit 1
            fi
            if [[ "$state" == "COMPLETED" ]]; then
              stories="$(jq -r '.stories' <<< "$status")"
              categories="$(jq -r '.categories' <<< "$status")"
              minimum_stories="$(jq -r '.minimumStories' <<< "$status")"
              minimum_categories="$(jq -r '.minimumCategories' <<< "$status")"
              reasons="$(jq -r '.blockReasons | join(", ")' <<< "$status")"
              {
                echo "### 브리핑 발송 불가"
                echo ""
                echo "- 생성 뉴스: ${stories}건 / 최소 ${minimum_stories}건"
                echo "- 포함 분야: ${categories}개 / 최소 ${minimum_categories}개"
                echo "- 이유: ${reasons}"
                echo ""
                echo "> 확인된 전날 뉴스 카드가 없어 발송하지 않습니다. 스포츠·e스포츠 부재는 발송 차단 사유가 아닙니다."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Briefing is not publishable: $reasons" >&2
              exit 1
            fi
            sleep 10
          done
          echo "AI briefing generation did not finish within the operational wait window" >&2
          exit 1

      - name: Dispatch after recovered generation
        id: dispatch
        if: steps.operation.outputs.operation == 'run'
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
        run: |
          dispatch_result="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 90 \
            -X POST "https://morningnews.coders.kr/api/admin/briefings/dispatch" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN")"
          dispatch_status="$(jq -r '.status // empty' <<< "$dispatch_result")"
          if [[ "$dispatch_status" != "COMPLETED" && "$dispatch_status" != "COMPLETED_WITH_DEADLINE_FALLBACK" ]]; then
            echo "Morning briefing dispatch did not complete: ${dispatch_result}" >&2
            exit 1
          fi
          active="$(jq -r '.activeSubscriptions // 0' <<< "$dispatch_result")"
          due="$(jq -r '.dueSubscriptions // 0' <<< "$dispatch_result")"
          delivered="$(jq -r '.delivered // 0' <<< "$dispatch_result")"
          failed="$(jq -r '.failed // 0' <<< "$dispatch_result")"
          echo "status=$dispatch_status" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "delivered=$delivered" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "### 07:30 웹 알림 발송 결과"
            echo ""
            echo "- 상태: ${dispatch_status}"
            echo "- 활성 기기: ${active}대"
            echo "- 발송 대상: ${due}대"
            echo "- 발송 성공: ${delivered}대"
            echo "- 발송 실패: ${failed}대"
            echo ""
            echo "> 일시적인 웹푸시 오류는 서버에서 기기별 최대 3회 재시도합니다."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( failed > 0 )); then
            echo "Web push completed with ${failed} failed device(s)" >&2
          fi

      - name: Dispatch regenerated briefing to every active device
        if: steps.operation.outputs.operation == 'regenerate-all'
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
        run: |
          briefing_date="$(TZ=Asia/Seoul date +%F)"
          active="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 90 \
            "https://morningnews.coders.kr/api/admin/briefings/subscriptions" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" | jq -r '.activeSubscriptions')"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 180 \
            -X POST "https://morningnews.coders.kr/api/admin/briefings/dispatch-all" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"expectedBriefingDate\":\"${briefing_date}\",\"expectedActiveSubscriptions\":${active}}"

      - name: Send private Telegram operator report
        if: ${{ always() && (steps.operation.outputs.final_delivery == 'true' || (github.event_name == 'workflow_dispatch' && inputs.send_telegram_report)) }}
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.BRIEFING_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          DISPATCH_STATUS: ${{ steps.dispatch.outputs.status }}
          DISPATCH_ACTIVE: ${{ steps.dispatch.outputs.active }}
          DISPATCH_DUE: ${{ steps.dispatch.outputs.due }}
          DISPATCH_DELIVERED: ${{ steps.dispatch.outputs.delivered }}
          DISPATCH_FAILED: ${{ steps.dispatch.outputs.failed }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram operator report is not configured; add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets." >&2
            exit 1
          fi

          status_json="$(curl --silent --show-error \
            --retry 2 --retry-all-errors --max-time 30 \
            "https://morningnews.coders.kr/api/admin/briefings/status" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" 2>/dev/null || echo '{}')"
          metrics_json="$(curl --silent --show-error \
            --retry 2 --retry-all-errors --max-time 30 \
            "https://morningnews.coders.kr/api/admin/editorial/metrics" \
            -H "X-Briefing-Admin-Token: $ADMIN_TOKEN" 2>/dev/null || echo '{}')"

          briefing_date="$(jq -r '.date // "확인 불가"' <<< "$status_json" 2>/dev/null || echo '확인 불가')"
          production_ready="$(jq -r '.productionReady // false' <<< "$status_json" 2>/dev/null || echo false)"
          coverage_ready="$(jq -r '.coverageReady // false' <<< "$status_json" 2>/dev/null || echo false)"
          stories="$(jq -r '.stories // 0' <<< "$status_json" 2>/dev/null || echo 0)"
          categories="$(jq -r '.categories // 0' <<< "$status_json" 2>/dev/null || echo 0)"
          minimum_stories="$(jq -r '.minimumStories // 0' <<< "$status_json" 2>/dev/null || echo 0)"
          minimum_categories="$(jq -r '.minimumCategories // 0' <<< "$status_json" 2>/dev/null || echo 0)"
          generation_warnings="$(jq -r '.generationJob.result.generationWarnings // [] | join("; ")' <<< "$status_json" 2>/dev/null || true)"
          if [[ -n "$DISPATCH_STATUS" ]]; then
            dispatch_status="$DISPATCH_STATUS"
            active="${DISPATCH_ACTIVE:-0}"
            due="${DISPATCH_DUE:-0}"
            delivered="${DISPATCH_DELIVERED:-0}"
            failed="${DISPATCH_FAILED:-0}"
          else
            dispatch_status="확인 필요"
            active="$(jq -r '.activeSubscriptions // 0' <<< "$metrics_json" 2>/dev/null || echo 0)"
            delivered="$(jq -r '.recentDelivered // 0' <<< "$metrics_json" 2>/dev/null || echo 0)"
            failed="$(jq -r '.recentFailed // 0' <<< "$metrics_json" 2>/dev/null || echo 0)"
            due=$((delivered + failed))
          fi
          reasons="$(jq -r '.blockReasons // [] | join(", ")' <<< "$status_json" 2>/dev/null || true)"

          if [[ "$JOB_STATUS" == "success" && "$production_ready" == "true" && "$coverage_ready" == "true" && "$failed" == "0" ]]; then
            headline="✅ 아침결 일일 운영 보고 · 정상"
          elif [[ "$JOB_STATUS" == "success" && "$production_ready" == "true" ]]; then
            headline="⚠️ 아침결 일일 운영 보고 · 일부 실패"
          else
            headline="🚨 아침결 일일 운영 보고 · 확인 필요"
          fi

          report="${headline}

          기준일: ${briefing_date}
          작업 결과: ${JOB_STATUS}
          발송 상태: ${dispatch_status}
          생성 뉴스: ${stories}건 / 기준 ${minimum_stories}건
          포함 분야: ${categories}개 / 기준 ${minimum_categories}개
          활성 기기: ${active}대
          발송 대상: ${due}대
          발송 성공: ${delivered}대
          발송 실패: ${failed}대"

          if [[ -n "$generation_warnings" ]]; then
            report="${report}
          생성 경고: ${generation_warnings:0:800}"
          fi

          if [[ -n "$reasons" ]]; then
            report="${report}
          확인 사항: ${reasons}"
          fi

          report="${report}
          작업 확인: ${RUN_URL}"

          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${report}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "protect_content=true")"
          jq -e '.ok == true' <<< "$response" >/dev/null
          {
            echo "### 텔레그램 운영 보고"
            echo ""
            echo "- 상태: 전송 완료"
            echo "- 대상: 등록된 운영자 채팅"
            echo "- 내용: 07:30 웹 알림 성공·실패 및 뉴스 생성 현황"
          } >> "$GITHUB_STEP_SUMMARY"

