version: "1"
mode: standalone

services:
  web:
    dockerfile: frontend/Dockerfile
    context: frontend
    port: 80
    expose: public
    env:
      BACKEND_URL: ${api.internal_url}

  api:
    dockerfile: backend/Dockerfile
    context: backend
    port: 8080
    env:
      DATABASE_URL: jdbc:postgresql://${db.host}:${db.port}/${db.name}
      DATABASE_USER: ${db.user}
      DATABASE_PASSWORD: ${db.password}
      DB_POOL_MAX_SIZE: "24"
      DB_POOL_MIN_IDLE: "4"
      DB_POOL_CONNECTION_TIMEOUT_MS: "30000"
      BACKUP_ENABLED: "true"
      BACKUP_STORAGE_BUCKET: ${backups.bucket}
      BACKUP_STORAGE_ENDPOINT: ${backups.s3_endpoint}
      BACKUP_STORAGE_ACCESS_KEY: ${backups.access_key}
      BACKUP_STORAGE_SECRET_KEY: ${backups.secret_key}
      NEWS_PIPELINE_ENABLED: "true"
      GDELT_NEWS_ENABLED: "false"
      GDELT_MINIMUM_ARTICLE_COUNT: "3"
      GDELT_MINIMUM_SIGNIFICANCE: "0.45"
      OFFICIAL_NEWS_RSS_ENABLED: "true"
      NEWS_GENERATE_ON_STARTUP: "false"
      NEWS_COLLECTION_CRON: "0 0 0-5 * * MON-FRI"
      NEWS_GENERATION_CRON: "0 0 0-5 * * MON-FRI"
      NEWS_FINALIZATION_CRON: "0 0 6 * * MON-FRI"
      NEWS_FINALIZATION_TIME: "06:00"
      DEMO_DATA_ENABLED: "false"
      OPENAI_CANDIDATE_MODEL: "gpt-5.6-luna"
      OPENAI_EDITOR_MODEL: "gpt-5.6-terra"
      NEWS_EDITORIAL_PASS_ENABLED: "true"
      OPENAI_EDITOR_READ_TIMEOUT_SECONDS: "180"
      OPENAI_CONNECT_TIMEOUT_SECONDS: "10"
      OPENAI_READ_TIMEOUT_SECONDS: "90"
      NEWS_MAX_CANDIDATES_PER_CATEGORY: "14"
      NEWS_MAX_ARTICLES_PER_CATEGORY: "160"
      NEWS_SEARCH_MAX_PAGES: "5"
      NEWS_MAX_AI_CANDIDATES: "120"
      NEWS_AI_CONCURRENCY: "4"
      NEWS_MAX_STORIES_PER_CATEGORY: "15"
      NEWS_ECONOMY_FINANCE_MAX_STORIES_PER_CATEGORY: "15"
      NEWS_ECONOMY_FINANCE_MAX_STORIES_TOTAL: "15"
      NEWS_MAX_STORIES: "15"
      NEWS_TARGET_STORIES: "15"
      NEWS_MINIMUM_IMPORTANCE_SCORE: "65"
      NEWS_MINIMUM_DELIVERY_STORIES: "10"
      NEWS_MINIMUM_DELIVERY_CATEGORIES: "5"
      NEWS_REQUIRED_CATEGORIES: "SPORTS,ESPORTS"
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_DELIVERY_CONCURRENCY: "16"
      PUBLIC_APP_URL: "https://morningnews.coders.kr"
      TRUST_CODERS_USER_HEADER: "false"
      PUBLIC_WRITE_LIMIT_PER_MINUTE: "30"
      ADMIN_LIMIT_PER_MINUTE: "60"

  db:
    type: postgres
    size: 1Gi

  backups:
    type: object
    quota_gb: 1
